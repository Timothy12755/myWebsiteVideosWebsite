<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shared Video Vault</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- SECURE GATE: Lock Screen View Cover -->
    <div id="lockScreen" class="lock-screen-overlay">
        <div class="lock-box">
            <h2>🔒 Private Video Library</h2>
            <p>Access Restricted. Please enter your approval PIN:</p>
            <input type="password" id="pinInput" placeholder="Enter PIN..." autofocus>
            <button id="unlockBtn">Unlock Dashboard</button>
            <p id="errorMessage" class="error-msg"></p>
        </div>
    </div>

    <!-- MAIN APP LAYOUT (Hidden structurally until unlocked) -->
    <div id="mainApp" class="hidden-app-wrapper">
        <header>
            <h1>My Personal Video Library</h1>
        </header>

        <div class="layout-container">
            <!-- Sidebar Navigation Categories -->
            <aside class="sidebar">
                <h3>Categories</h3>
                <ul id="categoryMenu">
                    <li class="category-item active" data-category="all">All Videos</li>
                    <li class="category-item" data-category="tutorials">Tutorials</li>
                    <li class="category-item" data-category="vlogs">Vlogs</li>
                    <li class="category-item" data-category="gaming">Gaming</li>
                    <li class="category-item" data-category="favorites">Favorites</li>
                </ul>
            </aside>

            <!-- Video Interface Feed Area -->
            <main class="content-area">
                <div class="search-container">
                    <input type="text" id="searchBar" placeholder="🔍 Search videos by title...">
                </div>

                <h2 class="section-title" id="currentCategoryTitle">All Videos</h2>
                
                <div class="media-grid" id="mediaGrid">
                    <!-- Videos insert here automatically from the database array below -->
                </div>
            </main>
        </div>
    </div>

    <script>
        // 🔑 YOUR PASSWORD IS SET HERE. Type exactly 7777 to pass the lock screen!
        const CORRECT_PIN = "7777"; 

        // 🎬 YOUR PERMANENT VIDEO DATABASE
        // Paste your video link inside the "url" quotes. It will stay there forever!
        const MY_VIDEO_COLLECTION = [
            {
                title: "First Permanent Video",
                category: "tutorials",
                url: "https://w3schools.com" 
            },
            {
                title: "Second Permanent Video",
                category: "vlogs",
                url: "https://w3schools.com" 
            }
        ];

        const lockScreen = document.getElementById('lockScreen');
        const mainApp = document.getElementById('mainApp');
        const pinInput = document.getElementById('pinInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMessage');

        function verifyAndUnlock() {
            const enteredValue = pinInput.value.trim();

            if (enteredValue === CORRECT_PIN) {
                lockScreen.style.setProperty('display', 'none', 'important');
                mainApp.classList.remove('hidden-app-wrapper');
                drawVideoDashboard();
            } else {
                errorMsg.textContent = "❌ Incorrect Approval PIN. Access Denied.";
                pinInput.value = '';
                pinInput.focus();
            }
        }

        unlockBtn.addEventListener('click', verifyAndUnlock);
        pinInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyAndUnlock();
        });

        function drawVideoDashboard() {
            const mediaGrid = document.getElementById('mediaGrid');
            const categoryItems = document.querySelectorAll('.category-item');
            const currentCategoryTitle = document.getElementById('currentCategoryTitle');
            const searchBar = document.getElementById('searchBar');

            function renderCards() {
                mediaGrid.innerHTML = '';

                MY_VIDEO_COLLECTION.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    card.setAttribute('data-category', video.category);

                    card.innerHTML = `
                        <div class="media-wrapper">
                            <video controls>
                                <source src="${video.url}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                        <div class="media-info">
                            <h3 class="media-title">${video.title}</h3>
                            <p>Category: ${video.category.charAt(0).toUpperCase() + video.category.slice(1)}</p>
                        </div>
                    `;
                    mediaGrid.appendChild(card);
                });
                applyFiltersPipeline();
            }

            categoryItems.forEach(item => {
                item.addEventListener('click', function() {
                    categoryItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    currentCategoryTitle.textContent = this.textContent;
                    applyFiltersPipeline();
                });
            });

            searchBar.addEventListener('input', applyFiltersPipeline);

            function applyFiltersPipeline() {
                const targetActiveCategory = document.querySelector('.category-item.active').getAttribute('data-category');
                const cleanQueryText = searchBar.value.toLowerCase().trim();
                const allActiveCards = mediaGrid.querySelectorAll('.media-card');

                allActiveCards.forEach(card => {
                    const trackingCategory = card.getAttribute('data-category');
                    const trackingTitle = card.querySelector('.media-title').textContent.toLowerCase();

                    const categoryFlag = (targetActiveCategory === 'all' || trackingCategory === targetActiveCategory);
                    const characterQueryFlag = trackingTitle.includes(cleanQueryText);

                    card.style.display = (categoryFlag && characterQueryFlag) ? 'block' : 'none';
                });
            }

            renderCards();
        }
    </script>
</body>
</html>
