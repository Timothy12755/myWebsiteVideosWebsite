<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Media Vault</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- SECURE GATE: Main Lock Screen View Cover -->
    <div id="lockScreen" class="lock-screen-overlay">
        <div class="lock-box">
            <h2>🔒 Private Media Library</h2>
            <p>Access Restricted. Please enter your approval PIN:</p>
            <input type="password" id="pinInput" placeholder="Enter PIN..." autofocus>
            <button id="unlockBtn">Unlock Dashboard</button>
            <p id="errorMessage" class="error-msg"></p>
        </div>
    </div>

    <!-- MAIN APP LAYOUT (Completely hidden structurally until the PIN verification passes) -->
    <div id="mainApp" class="hidden-app-wrapper">
        <header>
            <h1>My Multi-Media Vault</h1>
            <input type="file" id="media-upload-input" accept="video/*,image/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button class="upload-btn" id="triggerUploadBtn">
                ➕ Upload File
            </button>
        </header>

        <div class="layout-container">
            <!-- Sidebar Format Filter Navigation Area -->
            <aside class="sidebar">
                <h3>Filter Type</h3>
                <ul id="typeMenu">
                    <li class="type-item active" data-type="all">All Files</li>
                    <li class="type-item" data-type="video">Videos 🎥</li>
                    <li class="type-item" data-type="image">Images 🖼️</li>
                    <li class="type-item" data-type="document">Documents 📄</li>
                </ul>
            </aside>

            <!-- Main Interactive Feed Workspace -->
            <main class="content-area">
                <div class="search-container">
                    <input type="text" id="searchBar" placeholder="🔍 Search files by custom title...">
                </div>

                <h2 class="section-title" id="currentFeedTitle">All Files</h2>
                
                <div class="media-grid" id="mediaGrid">
                    <!-- Dynamic client rendering cards insert here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Configuration Dialog Overlay -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-box">
            <h3>Configure Media Information</h3>
            <label for="modalTitle">Custom Card Title</label>
            <input type="text" id="modalTitle" placeholder="Enter file name display title...">
            <div class="modal-actions">
                <button class="cancel-btn" id="cancelBtn">Cancel</button>
                <button class="save-btn" id="saveBtn">Confirm Upload</button>
            </div>
        </div>
    </div>

    <!-- Isolated Clean-Pipeline JavaScript Engine -->
    <script>
        const CORRECT_PIN = "7777"; 

        const lockScreen = document.getElementById('lockScreen');
        const mainApp = document.getElementById('mainApp');
        const pinInput = document.getElementById('pinInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMessage');

        // Clean event handling logic to pass the lockscreen barrier
        function verifyAndUnlock() {
            const enteredValue = pinInput.value.trim();

            if (enteredValue === CORRECT_PIN) {
                // Remove the login gate screen entirely and activate hidden layout containers
                lockScreen.style.setProperty('display', 'none', 'important');
                mainApp.classList.remove('hidden-app-wrapper');
                
                // Fire internal local memory layout streams
                initializeVaultWorkspace();
            } else {
                errorMsg.textContent = "❌ Incorrect Approval PIN. Access Denied.";
                pinInput.value = '';
                pinInput.focus();
            }
        }

        unlockBtn.addEventListener('click', verifyAndUnlock);
        pinInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyAndUnlock();
        });

        // --- ENCAPSULATED SEPARATED INTERFACE WORKSPACE ENGINE ---
        function initializeVaultWorkspace() {
            const triggerUploadBtn = document.getElementById('triggerUploadBtn');
            const fileInput = document.getElementById('media-upload-input');
            const mediaGrid = document.getElementById('mediaGrid');
            const uploadModal = document.getElementById('uploadModal');
            const modalTitle = document.getElementById('modalTitle');
            const cancelBtn = document.getElementById('cancelBtn');
            const saveBtn = document.getElementById('saveBtn');
            const typeItems = document.querySelectorAll('.type-item');
            const currentFeedTitle = document.getElementById('currentFeedTitle');
            const searchBar = document.getElementById('searchBar');

            let vaultItemsDatabase = [];

            // Open OS File Explorer dialog view box
            triggerUploadBtn.addEventListener('click', () => fileInput.click());

            function syncCacheAndRefresh() {
                const storedData = localStorage.getItem('mySecureMediaVault');
                vaultItemsDatabase = storedData ? JSON.parse(storedData) : [];
                drawInterfaceCards();
            }

            let fileMetaCache = { name: '', type: '', dataBlob: '' };

            fileInput.addEventListener('change', function(event) {
                const targetedFile = event.target.files[0];
                if (!targetedFile) return;

                fileMetaCache.name = targetedFile.name;
                
                if (targetedFile.type.startsWith('video/')) {
                    fileMetaCache.type = 'video';
                } else if (targetedFile.type.startsWith('image/')) {
                    fileMetaCache.type = 'image';
                } else {
                    fileMetaCache.type = 'document';
                }

                const readerEngine = new FileReader();
                readerEngine.onload = function(e) {
                    fileMetaCache.dataBlob = e.target.result;
                    modalTitle.value = fileMetaCache.name.split('.').slice(0, -1).join('.');
                    uploadModal.classList.add('show');
                };
                readerEngine.readAsDataURL(targetedFile);
            });

            cancelBtn.addEventListener('click', () => {
                uploadModal.classList.remove('show');
                fileInput.value = '';
            });

            saveBtn.addEventListener('click', () => {
                const finalTitleText = modalTitle.value.trim() || "Untitled Vault File";

                const newRecord = {
                    uniqueId: 'item_' + Date.now(),
                    title: finalTitleText,
                    formatType: fileMetaCache.type,
                    originalFileName: fileMetaCache.name,
                    base64Data: fileMetaCache.dataBlob
                };

                vaultItemsDatabase.unshift(newRecord);

                try {
                    localStorage.setItem('mySecureMediaVault', JSON.stringify(vaultItemsDatabase));
                    drawInterfaceCards();
                    uploadModal.classList.remove('show');
                } catch (storageError) {
                    alert("🛑 Upload Error: This file is too large to fit into your web browser's offline LocalStorage allocation space.");
                }

                fileInput.value = '';
            });

            function drawInterfaceCards() {
                mediaGrid.innerHTML = '';

                if (vaultItemsDatabase.length === 0) {
                    mediaGrid.innerHTML = '<p style="color:#555; grid-column:1/-1; text-align:center; margin-top:40px; font-style:italic;">Vault feed empty. Click "➕ Upload File" above to add item records.</p>';
                    return;
                }

                vaultItemsDatabase.forEach(item => {
                    const cardBlock = document.createElement('div');
                    cardBlock.className = `media-card type-${item.formatType}`;
                    cardBlock.setAttribute('data-type', item.formatType);

                    let payloadHTML = '';
                    if (item.formatType === 'video') {
                        payloadHTML = `<div class="media-wrapper"><video controls src="${item.base64Data}"></video></div>`;
                    } else if (item.formatType === 'image') {
                        payloadHTML = `<div class="media-wrapper"><img src="${item.base64Data}" alt="vault item"></div>`;
                    } else {
                        payloadHTML = `
                            <div class="media-wrapper doc-placeholder">
                                <div class="doc-icon">📄</div>
                                <span class="file-extension-tag">${item.originalFileName.split('.').pop().toUpperCase()}</span>
                            </div>`;
                    }

                    cardBlock.innerHTML = `
                        <button class="delete-btn" data-target-id="${item.uniqueId}">🗑️</button>
                        ${payloadHTML}
                        <div class="media-info">
                            <h3 class="media-title">${item.title}</h3>
                            <p class="file-name-meta">${item.originalFileName}</p>
                            ${item.formatType === 'document' ? `<a href="${item.base64Data}" download="${item.originalFileName}" class="download-link-btn">⬇️ Download File</a>` : ''}
                        </div>
                    `;

                    // Bind delete listener triggers directly onto card structural output run loops
