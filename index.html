<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secure Multi-Media Vault</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- SECURE GATE: Lock Screen -->
    <div id="lockScreen" class="lock-screen-overlay">
        <div class="lock-box">
            <h2>🔒 Private Media Library</h2>
            <p>Access Restricted. Please enter your approval PIN:</p>
            <input type="password" id="pinInput" placeholder="Enter PIN...">
            <button onclick="checkPin()">Unlock Dashboard</button>
            <p id="errorMessage" class="error-msg"></p>
        </div>
    </div>

    <!-- MAIN APP LAYOUT (Hidden by default until unlocked) -->
    <div id="mainApp" style="display: none;">
        <header>
            <h1>My Multi-Media Vault</h1>
            <input type="file" id="media-upload-input" accept="video/*,image/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('media-upload-input').click()">
                ➕ Upload File
            </button>
        </header>

        <div class="layout-container">
            <!-- Sidebar Navigation Category System -->
            <aside class="sidebar">
                <h3>Filter Type</h3>
                <ul id="typeMenu">
                    <li class="type-item active" data-type="all">All Files</li>
                    <li class="type-item" data-type="video">Videos 🎥</li>
                    <li class="type-item" data-type="image">Images 🖼️</li>
                    <li class="type-item" data-type="document">Documents 📄</li>
                </ul>
            </aside>

            <!-- Main Media Feed Grid Workspace -->
            <main class="content-area">
                <div class="search-container">
                    <input type="text" id="searchBar" placeholder="🔍 Search files by custom title...">
                </div>

                <h2 class="section-title" id="currentFeedTitle">All Files</h2>
                
                <div class="media-grid" id="mediaGrid">
                    <!-- Cards populate dynamically here from LocalStorage cache -->
                </div>
            </main>
        </div>
    </div>

    <!-- Configuration Pop-up Modal window setup -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal-box">
            <h3>Configure Media Information</h3>
            <label for="modalTitle">Custom Card Title</label>
            <input type="text" id="modalTitle" placeholder="Enter title reference...">
            <div class="modal-actions">
                <button class="cancel-btn" id="cancelBtn">Cancel</button>
                <button class="save-btn" id="saveBtn">Confirm Upload</button>
            </div>
        </div>
    </div>

    <!-- JavaScript storage structure parsing, serialization, and filtering logic -->
    <script>
        const CORRECT_PIN = "7777"; 

        function checkPin() {
            const userInput = document.getElementById('pinInput').value.trim();
            const lockScreen = document.getElementById('lockScreen');
            const mainApp = document.getElementById('mainApp');
            const errorMsg = document.getElementById('errorMessage');

            if (userInput === CORRECT_PIN) {
                lockScreen.style.display = 'none';
                mainApp.style.display = 'block';
                loadSavedMedia();
            } else {
                errorMsg.textContent = "❌ Incorrect Approval PIN. Access Denied.";
                document.getElementById('pinInput').value = '';
            }
        }

        document.getElementById('pinInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPin();
        });

        // --- VAULT DATA STORAGE MANAGEMENT ---
        const fileInput = document.getElementById('media-upload-input');
        const mediaGrid = document.getElementById('mediaGrid');
        const uploadModal = document.getElementById('uploadModal');
        const modalTitle = document.getElementById('modalTitle');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');
        const typeItems = document.querySelectorAll('.type-item');
        const currentFeedTitle = document.getElementById('currentFeedTitle');
        const searchBar = document.getElementById('searchBar');

        let savedMediaList = [];
        let pendingFileName = '';
        let pendingFileType = '';
        let pendingFileDataURL = '';

        function loadSavedMedia() {
            const rawData = localStorage.getItem('mySecureMediaVault');
            if (rawData) {
                savedMediaList = JSON.parse(rawData);
            }
            renderAllMedia();
        }

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            pendingFileName = file.name;
            
            // Map file types to broad categories
            if (file.type.startsWith('video/')) {
                pendingFileType = 'video';
            } else if (file.type.startsWith('image/')) {
                pendingFileType = 'image';
            } else {
                pendingFileType = 'document';
            }

            // Convert to a base64 string to lock data inside LocalStorage safely
            const reader = new FileReader();
            reader.onload = function(e) {
                pendingFileDataURL = e.target.result;
                modalTitle.value = pendingFileName.split('.').slice(0, -1).join('.');
                uploadModal.classList.add('show');
            };
            reader.readAsDataURL(file);
        });

        cancelBtn.addEventListener('click', function() {
            uploadModal.classList.remove('show');
            fileInput.value = '';
        });

        saveBtn.addEventListener('click', function() {
            const titleText = modalTitle.value.trim() || "Untitled Item";

            const newMediaObj = {
                id: 'media_' + Date.now(),
                title: titleText,
                type: pendingFileType,
                fileName: pendingFileName,
                dataUrl: pendingFileDataURL
            };

            savedMediaList.unshift(newMediaObj);
            
            try {
                saveToLocalStorage();
                renderAllMedia();
                uploadModal.classList.remove('show');
            } catch (error) {
                alert("🛑 Storage Limit Exceeded! Large files cannot fit in your browser's basic cache memory. Please clear out old uploads.");
            }
            
            fileInput.value = '';
        });

        function renderAllMedia() {
            mediaGrid.innerHTML = '';
            
            savedMediaList.forEach(item => {
                const card = document.createElement('div');
                card.className = `media-card type-${item.type}`;
                card.setAttribute('data-type', item.type);
                
                let previewElement = '';

                // Generate specific visual containers depending on media format configurations
                if (item.type === 'video') {
                    previewElement = `
                        <div class="media-wrapper">
                            <video controls><source src="${item.dataUrl}"></video>
                        </div>`;
                } else if (item.type === 'image') {
                    previewElement = `
                        <div class="media-wrapper">
                            <img src="${item.dataUrl}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0;">
                        </div>`;
                } else {
                    // Document presentation card layout
                    previewElement = `
                        <div class="media-wrapper doc-placeholder">
                            <div class="doc-icon">📄</div>
                            <span class="file-extension-tag">${item.fileName.split('.').pop().toUpperCase()}</span>
                        </div>`;
                }

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteMedia('${item.id}')">🗑️</button>
                    ${previewElement}
                    <div class="media-info">
                        <h3 class="media-title">${item.title}</h3>
                        <p class="file-name-meta">${item.fileName}</p>
                        ${item.type === 'document' ? `<a href="${item.dataUrl}" download="${item.fileName}" class="download-link-btn">⬇️ Download File</a>` : ''}
                    </div>
                `;
                mediaGrid.appendChild(card);
            });
            applyFilters();
        }

        function deleteMedia(id) {
            if (confirm("Are you sure you want to permanently delete this file?")) {
                savedMediaList = savedMediaList.filter(item => item.id !== id);
                saveToLocalStorage();
                renderAllMedia();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('mySecureMediaVault', JSON.stringify(savedMediaList));
        }

        typeItems.forEach(item => {
            item.addEventListener('click', function() {
                typeItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                currentFeedTitle.textContent = this.textContent;
                applyFilters();
            });
        });

        searchBar.addEventListener('input', applyFilters);

        function applyFilters() {
            const activeType = document.querySelector('.type-item.active').getAttribute('data-type');
