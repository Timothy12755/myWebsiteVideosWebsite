        const mainApp = document.getElementById('mainApp');

        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMessage');

        function verifyAndUnlock() {
            const enteredValue = pinInput.value.trim();

            if (enteredValue === CORRECT_PIN) {
                lockScreen.style.setProperty('display', 'none', 'important');
                mainApp.classList.remove('hidden-app-wrapper');
                drawVideoDashboard();
            } else {
                errorMsg.textContent = "❌ Incorrect Approval PIN. Access Denied.";
                pinInput.value = '';
                pinInput.focus();
            }
        }

        unlockBtn.addEventListener('click', verifyAndUnlock);
        pinInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyAndUnlock();
        });

        function drawVideoDashboard() {
            const mediaGrid = document.getElementById('mediaGrid');
            const categoryItems = document.querySelectorAll('.category-item');
            const currentCategoryTitle = document.getElementById('currentCategoryTitle');
            const searchBar = document.getElementById('searchBar');

            function renderCards() {
                mediaGrid.innerHTML = '';

                MY_VIDEO_COLLECTION.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    card.setAttribute('data-category', video.category);

                    card.innerHTML = `
                        <div class="media-wrapper">
                            <video controls>
                                <source src="${video.url}" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                        <div class="media-info">
                            <h3 class="media-title">${video.title}</h3>
                            <p>Category: ${video.category.charAt(0).toUpperCase() + video.category.slice(1)}</p>
                        </div>
                    `;
                    mediaGrid.appendChild(card);
                });
                applyFiltersPipeline();
            }

            categoryItems.forEach(item => {
                item.addEventListener('click', function() {
                    categoryItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    currentCategoryTitle.textContent = this.textContent;
                    applyFiltersPipeline();
                });
            });

            searchBar.addEventListener('input', applyFiltersPipeline);

            function applyFiltersPipeline() {
                const targetActiveCategory = document.querySelector('.category-item.active').getAttribute('data-category');
                const cleanQueryText = searchBar.value.toLowerCase().trim();
                const allActiveCards = mediaGrid.querySelectorAll('.media-card');

                allActiveCards.forEach(card => {
                    const trackingCategory = card.getAttribute('data-category');
                    const trackingTitle = card.querySelector('.media-title').textContent.toLowerCase();

                    const categoryFlag = (targetActiveCategory === 'all' || trackingCategory === targetActiveCategory);
                    const characterQueryFlag = trackingTitle.includes(cleanQueryText);

                    card.style.display = (categoryFlag && characterQueryFlag) ? 'block' : 'none';
                });
            }

            renderCards();
        }
